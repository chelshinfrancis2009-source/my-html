<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Alna</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap');

:root {
  --ink: #263044;
  --muted: #697286;
  --paper: #fff9ef;
  --peach: #f7b39f;
  --yellow: #f5ce66;
  --blue: #b9d9e8;
  --line: rgba(38, 48, 68, .18);
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background: #dbe8e4;
  font-family: 'DM Sans', sans-serif;
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px);
  background-size: 28px 28px;
  content: '';
  opacity: .35;
}

body::after {
  position: fixed;
  right: -110px;
  bottom: -100px;
  z-index: -1;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: var(--peach);
  content: '';
  opacity: .6;
}

#fireworks {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.page {
  width: min(100% - 36px, 980px);
  min-height: 100vh;
  margin: auto;
  padding: 28px 0 40px;
}

.note {
  position: relative;
  min-height: calc(100vh - 68px);
  padding: clamp(28px, 7vw, 72px) clamp(24px, 8vw, 90px);
  overflow: hidden;
  background: var(--paper);
  box-shadow: 10px 12px 0 rgba(38, 48, 68, .12);
  transform: rotate(-.6deg);
  animation: arrive .9s ease both;
}

.note::before,
.note::after {
  position: absolute;
  width: 92px;
  height: 28px;
  background: rgba(245, 206, 102, .72);
  content: '';
  opacity: .75;
}

.note::before { top: 25px; left: -27px; transform: rotate(-42deg); }
.note::after { right: -27px; bottom: 26px; transform: rotate(-42deg); background: rgba(185, 217, 232, .8); }

.corner { position: absolute; top: 26px; right: 38px; color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
.kicker { margin: 0 0 18px; color: #d76f62; font-size: .76rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

h1, h2 { margin: 0; font-family: 'Caveat', cursive; font-weight: 700; line-height: .86; }
h1 { max-width: 700px; font-size: clamp(5.4rem, 16vw, 11rem); }
h1 span { display: inline-block; color: #dc7663; transform: rotate(-3deg); }
h2 { margin-top: 32px; color: #dc7663; font-size: clamp(2.8rem, 7vw, 5.2rem); }

.message {
  max-width: 570px;
  margin: 34px 0 0 7px;
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.8;
}

.message p { margin: 0 0 18px; }
.message .lead { color: var(--ink); font-size: 1.16rem; }

.cake-area {
  max-width: 430px;
  margin: 28px 0 8px;
  padding: 22px 24px 18px;
  background: rgba(185, 217, 232, .28);
  border: 1px solid rgba(38, 48, 68, .12);
  text-align: center;
}

.cake-stage {
  position: relative;
  height: 175px;
  padding-top: 52px;
}

.cake {
  position: relative;
  width: 210px;
  height: 78px;
  margin: 0 auto;
  border-radius: 10px 10px 18px 18px;
  background: #e99078;
  box-shadow: inset 0 -14px 0 rgba(180, 78, 84, .22), 0 9px 0 rgba(38, 48, 68, .13);
  transition: transform .55s ease, opacity .55s ease;
}

.cake::before {
  position: absolute;
  top: -18px;
  left: -8px;
  width: 226px;
  height: 30px;
  border-radius: 50%;
  background: #fff4df;
  box-shadow: inset 0 -5px 0 #f2c2a8;
  content: '';
}

.cake::after {
  position: absolute;
  top: -4px;
  left: 0;
  width: 210px;
  height: 18px;
  background: repeating-linear-gradient(90deg, transparent 0 22px, #f7ce68 22px 29px);
  content: '';
  opacity: .85;
}

.cake-piece {
  position: absolute;
  top: -2px;
  right: -7px;
  width: 53px;
  height: 64px;
  border-radius: 5px 7px 16px 5px;
  background: #e99078;
  opacity: 0;
  transform: translateX(0) rotate(0);
  transition: opacity .55s ease, transform .7s ease;
}

.candle {
  position: absolute;
  z-index: 1;
  top: -52px;
  width: 9px;
  height: 40px;
  border-radius: 4px 4px 2px 2px;
  background: var(--yellow);
}

.candle::before {
  position: absolute;
  top: -15px;
  left: 1px;
  width: 7px;
  height: 14px;
  border-radius: 50% 50% 45% 45%;
  background: #dc7663;
  box-shadow: 0 0 0 3px rgba(245, 206, 102, .22);
  content: '';
  animation: flicker .8s infinite alternate;
}

.candle:nth-child(1) { left: 58px; }
.candle:nth-child(2) { left: 100px; background: var(--blue); }
.candle:nth-child(3) { left: 142px; }
.cake-area.cut .cake { transform: translateX(-7px); }
.cake-area.cut .cake-piece { opacity: 1; transform: translate(50px, 8px) rotate(12deg); }
.cake-area.cut .candle::before { opacity: 0; transform: translateY(-8px) scale(.4); }
.cake-message { margin: 12px 0 0; color: var(--muted); font-size: .84rem; }
.cut-button { margin-top: 9px; padding: 10px 17px; color: var(--paper); background: #dc7663; }
.cut-button:hover { background: #c96155; }

@keyframes flicker { from { transform: scale(.85) rotate(-4deg); } to { transform: scale(1.1) rotate(4deg); } }

.divider {
  width: 115px;
  height: 3px;
  margin: 28px 0 25px 4px;
  background: var(--yellow);
  transform: rotate(-2deg);
}

.footer {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 30px;
  margin-top: 42px;
}

.signature { color: var(--ink); font-family: 'Caveat', cursive; font-size: 2.3rem; line-height: 1; }
.hint { max-width: 180px; margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.45; text-align: right; }
.hint strong { color: #d76f62; }

.doodle { position: absolute; color: var(--yellow); font-family: 'Caveat', cursive; font-size: 4.3rem; line-height: 1; }
.doodle.one { top: 22%; right: 9%; transform: rotate(12deg); }
.doodle.two { right: 18%; bottom: 20%; color: var(--blue); font-size: 3.5rem; transform: rotate(-16deg); }

@keyframes arrive { from { opacity: 0; transform: translateY(20px) rotate(-.6deg); } to { opacity: 1; transform: translateY(0) rotate(-.6deg); } }

@media (max-width: 680px) {
  .page { width: min(100% - 22px, 520px); padding-top: 12px; }
  .note { min-height: calc(100vh - 28px); padding: 64px 25px 38px; }
  .corner { top: 23px; right: 23px; }
  .message { margin-left: 0; }
  .footer { align-items: start; flex-direction: column; margin-top: 32px; }
  .hint { max-width: 220px; text-align: left; }
  .doodle.one { top: 25%; right: 8%; font-size: 3rem; }
  .doodle.two { right: 10%; bottom: 22%; font-size: 2.8rem; }
}
</style>
</head>
<body>
<canvas id="fireworks" aria-hidden="true"></canvas>
<main class="page">
  <article class="note">
    <div class="corner">20.09.2026</div>
    <p class="kicker">A little birthday note for you</p>
    <h1>Happy<br><span>birthday,</span><br>Alna.</h1>
    <div class="divider"></div>
    <div class="message">
      <p class="lead">brithday okkey alle enjoy chey thaa cake cut cheyytho</p>
      <div class="cake-area" id="cake-area">
        <div class="cake-stage" aria-label="A birthday cake with three candles">
          <div class="cake">
            <span class="candle"></span>
            <span class="candle"></span>
            <span class="candle"></span>
            <span class="cake-piece"></span>
          </div>
        </div>
        <button class="cut-button" id="cut-cake" type="button">Cut the cake</button>
        <p class="cake-message" id="cake-message" aria-live="polite">vettiko</p>
      </div>
    </div>
    <div class="footer">
      <div class="signature">Happy Birthday,</div>
      <p class="hint"><strong>One tiny secret:</strong><br>evide press cheyythalum fireworks kannam</p>
    </div>
    <div class="doodle one">✦</div>
    <div class="doodle two">♡</div>
  </article>
</main>
<script>
const canvas = document.querySelector('#fireworks');
const context = canvas.getContext('2d');
const particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function launchFirework(x, y, size = 1) {
  const colors = ['#dc7663', '#f5ce66', '#8fbfd2', '#6c829f', '#fff9ef'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let index = 0; index < 72 * size; index += 1) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 4 + 2) * size;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      color,
      radius: Math.random() * 2 + 1
    });
  }
}

function animate() {
  context.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach((particle, index) => {
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vy += .045;
    particle.alpha -= .014;
    context.globalAlpha = Math.max(particle.alpha, 0);
    context.fillStyle = particle.color;
    context.beginPath();
    context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
    context.fill();
    if (particle.alpha <= 0) particles.splice(index, 1);
  });
  context.globalAlpha = 1;
  requestAnimationFrame(animate);
}

document.addEventListener('click', event => {
  launchFirework(event.clientX, event.clientY, 1);
});

document.querySelector('#cut-cake').addEventListener('click', event => {
  event.stopPropagation();
  const cakeArea = document.querySelector('#cake-area');
  cakeArea.classList.toggle('cut');
  const isCut = cakeArea.classList.contains('cut');
  document.querySelector('#cut-cake').textContent = isCut ? 'Cake is served!' : 'Cut the cake';
  document.querySelector('#cake-message').textContent = isCut ? 'cut cheyythile oru slice edutho happy brithday' : 'vettiko';
  if (isCut) launchFirework(window.innerWidth * .5, window.innerHeight * .42, 1.3);
});

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
animate();
setTimeout(() => launchFirework(window.innerWidth * .75, window.innerHeight * .28, 1.15), 550);
setInterval(() => {
  launchFirework(Math.random() * window.innerWidth, Math.random() * window.innerHeight * .55, .8);
}, 2100);
</script>
</body>
</html>
